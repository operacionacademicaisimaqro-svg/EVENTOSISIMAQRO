<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficios y avisos</title>
<style>
:root{--navy:#14264a;--bg:#f4f6fa;--line:#dfe4ee;--acc:#d98b2b;--mut:#6b7691}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1c2842;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:44px 16px 56px;text-align:center}
header h1{margin:0 0 6px;font-size:2rem}
header p{margin:0;color:#b8c3dc}
main{max-width:820px;margin:-30px auto 60px;padding-top:0;padding:0 16px}
.hide{display:none}.search{margin-bottom:6px;width:100%;padding:14px 18px;border:2px solid var(--line);border-radius:12px;font:inherit;box-shadow:0 4px 18px rgba(20,38,74,.1)}
.search:focus{outline:none;border-color:var(--acc)}
h2{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:28px 0 8px}
.item{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:22px 20px;font-size:1.1rem;box-shadow:0 4px 14px rgba(20,38,74,.07);margin-bottom:10px;text-decoration:none;color:inherit;transition:.15s}
.item:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,38,74,.08)}
.ext{flex:none;width:56px;height:56px;border-radius:10px;background:#eaeef7;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem}
.t{flex:1;font-weight:600}
.d{display:block;font-weight:400;font-size:.85rem;color:var(--mut)}
.new{background:var(--acc);color:#fff;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px}
.go{color:var(--acc);font-weight:600;white-space:nowrap}
.msg{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<header><h1>Oficios y avisos</h1><p>Toca un botón para abrir el oficio</p></header>
<main>
<input class="search hide" id="q" placeholder="Buscar oficio…" autocomplete="off">
<div id="list"><p class="msg">Cargando…</p></div>
</main>
<script>
// Se detecta solo: usuario.github.io/REPO/  → lee la carpeta "oficios" de ese repositorio.
const FOLDER='oficios';
const USER=location.hostname.endsWith('github.io')?location.hostname.split('.')[0]:'';
const REPO=location.hostname.endsWith('github.io')?(location.pathname.split('/')[1]||''):'';
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let items=[];
const list=document.getElementById('list');

function parse(name){
 const base=name.replace(/\.[^.]+$/,''), ext=(name.split('.').pop()||'').toUpperCase();
 const m=base.match(/^(\d{4})-(\d{2})-(\d{2})[\s_-]*(.*)$/);
 let date=null,title=base;
 if(m){date=new Date(+m[1],+m[2]-1,+m[3]);title=m[4]||base;}
 return{name,ext:ext.slice(0,4),title:title.replace(/[_]+/g,' ').trim(),date};
}
function render(){
 const f=document.getElementById('q').value.toLowerCase().trim();
 const shown=items.filter(i=>i.title.toLowerCase().includes(f));
 if(!shown.length){list.innerHTML='<p class="msg">No hay oficios que coincidan.</p>';return;}
 const groups={};
 shown.forEach(i=>{const k=i.date?MESES[i.date.getMonth()]+' '+i.date.getFullYear():'Otros';(groups[k]=groups[k]||[]).push(i);});
 list.innerHTML=Object.keys(groups).map(k=>`<h2>${k}</h2>`+groups[k].map(i=>{
  const nuevo=i.date&&(Date.now()-i.date)/864e5<=7;
  const fecha=i.date?`${i.date.getDate()} de ${MESES[i.date.getMonth()]} de ${i.date.getFullYear()}`:'';
  const url=FOLDER+'/'+encodeURIComponent(i.name);
  return `<a class="item" href="${url}" target="_blank" rel="noopener"><span class="ext">${i.ext}</span>
  <span class="t"></span>${nuevo?'<span class="new">NUEVO</span>':''}<span class="go">Abrir →</span></a>`.replace('<span class="t"></span>',`<span class="t">${i.title.replace(/</g,'&lt;')}<span class="d">${fecha}</span></span>`);
 }).join('')).join('');
}
async function load(){
 if(!USER||!REPO){list.innerHTML='<p class="msg">Vista previa: los oficios aparecerán aquí cuando la página esté publicada en GitHub Pages.</p>';return;}
 try{
  let data=sessionStorage.getItem('ofi');
  if(!data){
   const r=await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}`);
   if(!r.ok)throw new Error(r.status);
   data=JSON.stringify(await r.json());
   try{sessionStorage.setItem('ofi',data);}catch(e){}
  }
  items=JSON.parse(data).filter(x=>x.type==='file'&&!/^\./.test(x.name)&&!/readme/i.test(x.name)).map(x=>parse(x.name))
   .sort((a,b)=>(b.date||0)-(a.date||0)||a.title.localeCompare(b.title));
  if(!items.length){list.innerHTML='<p class="msg">Todavía no hay oficios publicados.</p>';return;}
  if(items.length>8)document.getElementById('q').classList.remove('hide');
  render();
 }catch(e){list.innerHTML='<p class="msg">No se pudo cargar la lista. Recarga en un momento.</p>';}
}
document.getElementById('q').oninput=render;
load();
</script>
</body>
</html>
